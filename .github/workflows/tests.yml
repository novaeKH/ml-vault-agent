name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Parse PowerShell launchers with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @("setup.ps1", "run.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              exit 1
            }
          }
      - name: Smoke test Windows setup
        if: runner.os == 'Windows'
        shell: powershell
        run: .\setup.ps1 -SkipModels -SkipIndex
      - name: Run tests
        run: python -m pytest
